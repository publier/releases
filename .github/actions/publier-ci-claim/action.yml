name: 'Publier CI claim'
description: >-
  Mint a short-lived Publier CI-claim Biscuit for this job via Atestum's
  generic Workload Identity claim (`POST /v1/ci/claim`), then expose it as
  PUBLIER_TOKEN and seed the offline verifier's trust anchor. Requires the
  repository to be connected via the portal's "connect a repo for CI" flow and
  an active Publier subscription. Nothing is stored: no PUBLIER_TOKEN secret,
  no signing key, no long-lived credential anywhere in the repo.

# Why this action lives in publier/releases, not publier/publier
# ----------------------------------------------------------------
# This action is meant to be referenced by CUSTOMER repos via
# `uses: publier/releases/.github/actions/publier-ci-claim@main` — including
# ZonHoren's own dogfood repo (zonhoren/marketing-sites), a DIFFERENT GitHub
# org from `publier`. GitHub's private-repo action sharing
# (Settings > Actions > "Accessible from repositories owned by...") is scoped
# to repos owned by the SAME account/org as the private repo — it cannot be
# granted to a different org, let alone an arbitrary customer's own account.
# publier/publier is private; publier/releases is public and already the
# distribution point for the CLI binary + install.sh, so this action lives
# here. Public repos are referenceable via `uses:` from any caller regardless
# of owner, which is the actual requirement here.
#
# ADR-0008 cutover (2026-09-05) — what changed and why
# ----------------------------------------------------
# This action used to exchange the job's GitHub Actions OIDC token against
# atestum's bespoke `POST /v1/ci/claim-biscuit`. ADR-0008
# (`atestum/atestum` docs/adr/0008-publier-ci-auth-onto-workload-identity.md)
# RETIRED that endpoint — it now 404s in production — because it hardcoded
# Publier's product name into Atestum's lowest trust primitive. Publier CI now
# rides Atestum's generic Workload Identity path, exactly like every other
# Atestum tenant's CI.
#
# That is a different auth mechanism, not a different URL: the new flow
# presents the run's GITHUB_TOKEN (validated against the GitHub Workflow Run
# API as proof of run identity) plus an ephemeral Ed25519 public key the runner
# generates, rather than an OIDC token. `Atestum/setup-atestum` already
# implements that handshake — keypair generation in tmpfs, the claim body,
# retry/backoff, and the on-demand fallback when the webhook lost the race — so
# this action DELEGATES the claim to it rather than reimplementing a
# credential-handling flow. setup-atestum is public, so a customer repo in any
# org can still resolve this whole chain.
#
# What this action still owns, and why it is not just an alias:
#   * `PUBLIER_TOKEN` naming + the `token` / `expires-in` output contract its
#     existing callers already consume.
#   * The optional `env-file` bridge for melange/bubblewrap `--clearenv`
#     consumers, which never inherit the runner environment.
#   * Seeding `/publier/cli-config` into the CLI cache so license-core can
#     verify the Biscuit offline (see that step's own comment — without it
#     every build fails NoKeys even with a perfectly good Biscuit).
#
# PERMISSIONS CHANGE FOR CALLERS: this action no longer needs `id-token: write`
# (there is no OIDC token to request). It now needs `actions: read`, so Atestum
# can call the Workflow Run API to verify the run. Leaving `id-token: write` in
# place is harmless, but `actions: read` must be added or the claim fails.
#
# Trust binding note (for whoever maintains the atestum side): GitHub's `sub`
# claim is NOT immutable on an arbitrary customer's repo (use_immutable_subject
# is per-repo, admin-customizable, and this repo has no control over a
# customer's setting), so the server must bind on `repository_id` /
# `repository_owner_id`, never on `sub`. Nothing in this action can enforce
# that; it is recorded here so the constraint is visible from the client side.

inputs:
  api-url:
    description: >-
      Base URL of the Atestum control plane serving `/v1/ci/claim` and
      `/publier/cli-config`. Prefer this over the deprecated `endpoint`.
    required: false
    default: 'https://atestum.com'
  endpoint:
    description: >-
      DEPRECATED, accepted for backwards compatibility. Callers used to pass
      the full retired `.../v1/ci/claim-biscuit` URL here. When set, its ORIGIN
      is used and the path is discarded. Prefer `api-url`.
    required: false
    default: ''
  audience:
    description: >-
      DEPRECATED and IGNORED. The retired flow requested a GitHub OIDC token
      with this audience; the Workload Identity flow uses no OIDC token, so
      there is nothing to bind an audience to. Declared only so existing
      callers that still pass it do not break.
    required: false
    default: ''
  tenant:
    description: >-
      Optional Atestum tenant id. `repository` alone resolves the delegation,
      so this is a defense-in-depth integrity assertion, not a lookup key.
      Passed through to setup-atestum.
    required: false
    default: ''
  github-token:
    description: >-
      The run's GITHUB_TOKEN, used by Atestum only as proof of run identity
      (validated against the GitHub Workflow Run API, never trusted for
      authorization). Defaults to the automatic token. Requires `actions: read`.
    required: false
    default: ''
  env-file:
    description: >-
      Optional path to write `PUBLIER_TOKEN=<biscuit>` to, created mode 0600.
      Only needed by consumers that do not inherit the runner environment —
      melange runs `--clearenv`, so its `--env-file` is the only way in. Keep
      this OUTSIDE the repo checkout (point it at the runner temp dir, e.g.
      the RUNNER_TEMP env var) so it can never be copied into a build
      artifact. NOTE: do not write a literal GitHub expression in this file's
      metadata — GitHub parses expressions in action.yml inputs/outputs, and
      contexts like `runner` are not available there, so one in a
      *description* fails the whole action with "Unrecognized named-value"
      at load time.
    required: false
    default: ''
  seed-cli-config:
    description: >-
      Write `<api-url>/publier/cli-config`'s response verbatim to the CLI's
      cache (`~/.config/publier/cli-config.json`, honouring XDG_CONFIG_HOME) so
      an offline Biscuit verification can find the platform's root public key.
      Leave on unless the consumer does its own fetching. CAVEAT: this writes
      to the RUNNER's own $HOME, which a melange/bubblewrap `--clearenv` sandbox
      never sees. A caller building inside such a sandbox (e.g. marketing-
      sites' deploy-publier.yml) should set this to 'false' and rely on
      zonhoren/marketing-sites' `publier-jwks-seed` action instead — it
      already fetches this SAME `/publier/cli-config` document (which
      carries `biscuit_root_key`) and bridges it into the env-file as
      `PUBLIER_CLI_CONFIG_CACHE_B64` for the sandbox to decode.
    required: false
    default: 'true'

outputs:
  token:
    description: >-
      The minted Biscuit (URL-safe base64, no padding). Registered as a log
      mask by setup-atestum the moment it is parsed, so it is safe to pass
      through `env:` on consuming steps.
    value: ${{ steps.publier.outputs.token }}
  expires-in:
    description: >-
      Biscuit lifetime in seconds, derived from the claim's RFC 3339
      `expires-at`. Empty if the endpoint reported no expiry.
    value: ${{ steps.publier.outputs.expires-in }}
  proof-key:
    description: >-
      Path to the ephemeral Ed25519 private key file setup-atestum generated
      in tmpfs for this run (pass-through of its own `proof-key` output).
      `license-core`'s Biscuit-verify path (`publier/publier`
      `rust/license-core/src/verify.rs`) reads this to sign the per-request
      DPoP proof `POST /v1/ci/verify` needs — see that file's module doc for
      why an offline check can never satisfy this on its own. The file is
      never read or copied by this action; only its path is forwarded.
    value: ${{ steps.claim.outputs.proof-key }}

runs:
  using: composite
  steps:
    # --- 0. Resolve the control-plane base URL ----------------------------
    # `endpoint` used to be a FULL url ending in the now-retired
    # /v1/ci/claim-biscuit. Reduce whatever we were given to a bare origin so
    # both the old and new spellings work, and so the cli-config step below
    # cannot inherit a stale path suffix.
    - name: Resolve Atestum base URL
      id: base
      shell: bash
      env:
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
      run: |
        set -euo pipefail

        raw="${INPUT_ENDPOINT:-}"
        [ -n "$raw" ] || raw="${INPUT_API_URL:-}"
        [ -n "$raw" ] || raw='https://atestum.com'

        # Strip any known claim path, then any trailing slash.
        raw="${raw%/v1/ci/claim-biscuit}"
        raw="${raw%/v1/ci/claim}"
        raw="${raw%/}"

        case "$raw" in
          https://*|http://*) ;;
          *)
            echo "::error::Resolved Atestum base URL is not an http(s) URL: ${raw}"
            exit 1
            ;;
        esac

        echo "api-url=$raw" >> "$GITHUB_OUTPUT"
        echo "Using Atestum control plane at ${raw}."

    # --- 1. Claim the per-run Biscuit -------------------------------------
    # Delegated: see the ADR-0008 note in this file's header for why this is
    # not a hand-rolled curl exchange any more. Pinned to a released tag on a
    # first-party org repo rather than @main, so a change upstream cannot
    # silently alter every customer's CI auth.
    - name: Claim a per-run Atestum Biscuit
      id: claim
      uses: Atestum/setup-atestum@v1.0.3
      with:
        api-url: ${{ steps.base.outputs.api-url }}
        tenant: ${{ inputs.tenant }}
        github-token: ${{ inputs.github-token }}

    # --- 2. Republish under this action's own contract --------------------
    - name: Export PUBLIER_TOKEN
      id: publier
      shell: bash
      env:
        # Passed through env rather than interpolated into the script body so a
        # value containing shell metacharacters can never be executed.
        CLAIM_BISCUIT: ${{ steps.claim.outputs.biscuit }}
        CLAIM_EXPIRES_AT: ${{ steps.claim.outputs.expires-at }}
        CLAIM_PROOF_KEY: ${{ steps.claim.outputs.proof-key }}
        PUBLIER_CLAIM_ENV_FILE: ${{ inputs.env-file }}
      run: |
        set -euo pipefail
        umask 077

        biscuit="${CLAIM_BISCUIT:-}"
        if [ -z "$biscuit" ]; then
          echo "::error::setup-atestum returned no biscuit."
          exit 1
        fi
        # setup-atestum masks it already; re-assert cheaply in case that ever
        # regresses — a double mask is harmless, a missing one is not.
        echo "::add-mask::$biscuit"

        # Fail closed on anything that could break out of the `key=value` line
        # written to $GITHUB_OUTPUT / the env file below.
        case "$biscuit" in
          *[[:space:]]*)
            echo "::error::Minted Biscuit contains whitespace — refusing to propagate it."
            exit 1
            ;;
        esac

        # `expires-in` (seconds) is this action's historical contract;
        # setup-atestum reports an RFC 3339 `expires-at`. Convert, and degrade
        # to empty rather than failing the build if `date` cannot parse it —
        # the lifetime is advisory, the Biscuit's own `check if time(...)` is
        # what actually enforces expiry.
        expires_in=''
        if [ -n "${CLAIM_EXPIRES_AT:-}" ]; then
          if exp_epoch="$(date -u -d "$CLAIM_EXPIRES_AT" +%s 2>/dev/null)"; then
            now_epoch="$(date -u +%s)"
            delta=$(( exp_epoch - now_epoch ))
            [ "$delta" -gt 0 ] && expires_in="$delta"
          else
            echo "::warning::Could not parse expires-at '${CLAIM_EXPIRES_AT}'; reporting no lifetime."
          fi
        fi

        {
          echo "token=$biscuit"
          echo "expires-in=$expires_in"
        } >> "$GITHUB_OUTPUT"

        # --- Optional env file (melange --clearenv consumers) --------------
        # Create-if-absent + always APPEND. A caller commonly chains this
        # after publier-jwks-seed onto the SAME env-file (melange consumers
        # need both PUBLIER_TOKEN and the JWKS/cli-config cache bridge) — an
        # unconditional recreate-and-truncate here would silently wipe
        # whatever an earlier step already wrote to that file.
        if [ -n "${PUBLIER_CLAIM_ENV_FILE:-}" ]; then
          mkdir -p "$(dirname "$PUBLIER_CLAIM_ENV_FILE")"
          [ -f "$PUBLIER_CLAIM_ENV_FILE" ] || install -m 600 /dev/null "$PUBLIER_CLAIM_ENV_FILE"
          printf 'PUBLIER_TOKEN=%s\n' "$biscuit" >> "$PUBLIER_CLAIM_ENV_FILE"
          # Same sandbox-visibility caveat as `seed-cli-config` above: this is
          # a PATH into the runner's own tmpfs, which a melange/bubblewrap
          # `--clearenv` sandbox does not see unless that directory is
          # separately bind-mounted in. Written unconditionally anyway (a
          # consumer that doesn't need it just ignores the var) rather than
          # adding a second opt-out input for a caveat only a sandboxed
          # consumer needs to solve.
          if [ -n "${CLAIM_PROOF_KEY:-}" ]; then
            printf 'PUBLIER_PROOF_KEY=%s\n' "$CLAIM_PROOF_KEY" >> "$PUBLIER_CLAIM_ENV_FILE"
          fi
          echo "Wrote PUBLIER_TOKEN to ${PUBLIER_CLAIM_ENV_FILE} (mode 0600)."
        fi

        echo "Minted Publier CI-claim Biscuit: length=${#biscuit}, expires_in=${expires_in:-unreported}s."

    # --- 3. Seed the offline verifier's trust anchor -----------------------
    # REQUIRED for a consumer running directly on the runner — NOT sufficient
    # for a melange/bubblewrap `--clearenv` sandbox consumer, which never sees
    # this runner's $HOME/.config (see the `seed-cli-config` input doc above
    # for the fix in that case). license-core's Biscuit verification path
    # reads the platform's root public key from the CACHED `/publier/cli-config`
    # document (`CliConfig::biscuit_root_key`), never fetching it itself — see
    # publier/publier's `rust/license-core/src/verify.rs`'s own doc: "cached
    # from GET /publier/cli-config". A fresh CI container has no such cache
    # (only `publier login`'s interactive flow normally writes one), so
    # exporting PUBLIER_TOKEN alone yields UNVERIFIABLE (LicenseError::NoKeys)
    # and every build fails even with a perfectly good Biscuit. `read_cache()`
    # does a plain `serde_json::from_str` of the file, so it must be EXACTLY
    # the response body — no wrapping.
    - name: Seed the Publier CLI config cache for offline Biscuit verification
      if: inputs.seed-cli-config == 'true'
      shell: bash
      env:
        ATESTUM_BASE_URL: ${{ steps.base.outputs.api-url }}
      run: |
        set -euo pipefail
        umask 077

        origin="$ATESTUM_BASE_URL"
        cache_dir="${XDG_CONFIG_HOME:-$HOME/.config}/publier"
        mkdir -p "$cache_dir"

        if ! curl --silent --show-error --fail-with-body \
                  --retry 3 --retry-all-errors --retry-max-time 60 \
                  --connect-timeout 10 --max-time 30 \
                  -H 'Accept: application/json' \
                  -o "$cache_dir/cli-config.json.tmp" \
                  "${origin}/publier/cli-config"; then
          echo "::error::Could not fetch ${origin}/publier/cli-config."
          exit 1
        fi

        # Fail closed rather than cache a document with no root key — a cache
        # without one would look valid and fail later, further from the cause.
        if ! jq -er '.biscuit_root_key // empty' < "$cache_dir/cli-config.json.tmp" >/dev/null; then
          rm -f "$cache_dir/cli-config.json.tmp"
          echo "::error::${origin}/publier/cli-config has no biscuit_root_key."
          exit 1
        fi

        chmod 644 "$cache_dir/cli-config.json.tmp"
        mv "$cache_dir/cli-config.json.tmp" "$cache_dir/cli-config.json"
        echo "Seeded CLI config cache (with biscuit_root_key) at ${cache_dir}/cli-config.json."
